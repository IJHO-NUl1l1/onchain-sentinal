<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <!-- One gradient, reused everywhere — shield, rays, pulse line — so nothing reads
         as a separate, mismatched layer. Flare's own palette leans violet/magenta. -->
    <linearGradient id="flareGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="65%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="bgWash" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="480" rx="96" fill="#0a0a0a"/>
  <rect x="1" y="1" width="478" height="478" rx="95" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- faint wash, not a glow effect — same family as the gradient below it -->
  <circle cx="240" cy="214" r="210" fill="url(#bgWash)"/>

  <!-- shield, same gradient family as the wash behind it -->
  <path d="M240 92 L364 138 V250 C364 318 314 366 240 392 C166 366 116 318 116 250 V138 Z"
        fill="url(#flareGrad)"/>

  <!-- pulse line — flat, no blur, same stroke weight discipline as the rays outside -->
  <path d="M158 214 L204 214 L230 288 L268 174 L294 250 L322 250"
        fill="none" stroke="#0a0a0a" stroke-width="16"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
