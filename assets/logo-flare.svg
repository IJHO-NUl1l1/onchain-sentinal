<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <!-- Same family mark as the KeeperHub logo, recolored for the Flare submission.
       Flare's own branding leans red/coral/pink — no exact hex confirmed publicly,
       so this is an approximation, not a claimed brand match. -->
  <rect width="480" height="480" rx="96" fill="#0a0a0a"/>
  <rect x="1" y="1" width="478" height="478" rx="95" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- 방패 = 감시/방어. 아래로 갈수록 좁아지는 형태 -->
  <path d="M240 96 L360 140 V250 C360 316 312 362 240 388 C168 362 120 316 120 250 V140 Z"
        fill="none" stroke="#e4e4e7" stroke-width="18" stroke-linejoin="round"/>

  <!-- 방패 안의 선: KeeperHub 버전과 같은 자리, 색만 Flare 톤(coral/red)으로 -->
  <path d="M162 214 L206 214 L232 286 L268 178 L292 250 L318 250"
        fill="none" stroke="#f0455c" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
